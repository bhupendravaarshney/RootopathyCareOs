services:
  postgres:
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-careos_dev}
      POSTGRES_USER: ${DB_MIGRATION_USERNAME:-careos_migrator}
      POSTGRES_PASSWORD: ${DB_MIGRATION_PASSWORD:-careos-migrator-local-only}
      CAREOS_DB_APP_USER: ${DB_APP_USERNAME:-careos_app}
      CAREOS_DB_APP_PASSWORD: ${DB_APP_PASSWORD:-careos-app-local-only}
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 stores clusters below a major-version-specific directory.
      # Mount the parent so fresh initialization and future pg_upgrade --link
      # workflows do not cross a mount-point boundary.
      - careos-postgres:/var/lib/postgresql
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_MIGRATION_USERNAME:-careos_migrator} -d ${POSTGRES_DB:-careos_dev}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - careos-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # Pinned legacy server is for synthetic local compatibility only; it is not a production recommendation.
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: careos-local
      MINIO_ROOT_PASSWORD: careos-local-change-me
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - careos-minio:/data

  mailpit:
    image: axllent/mailpit:latest@sha256:98b916bd3c8d61f7633a52d3ea2f58d00620cb01ca57ab59edde68c347a95365
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build:
      context: ./backend
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-careos_dev}
      DB_APP_USERNAME: ${DB_APP_USERNAME:-careos_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-careos-app-local-only}
      DB_MIGRATION_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-careos_dev}
      DB_MIGRATION_USERNAME: ${DB_MIGRATION_USERNAME:-careos_migrator}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:-careos-migrator-local-only}
      DB_APP_ROLE: ${DB_APP_USERNAME:-careos_app}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CONNECT_TIMEOUT: ${REDIS_CONNECT_TIMEOUT:-2s}
      REDIS_COMMAND_TIMEOUT: ${REDIS_COMMAND_TIMEOUT:-2s}
      CAREOS_NOTIFICATIONS_POSTGRES_ENABLED: ${CAREOS_NOTIFICATIONS_POSTGRES_ENABLED:-false}
      CAREOS_NOTIFICATIONS_ACTIVE_ENCRYPTION_KEY_ID: ${CAREOS_NOTIFICATIONS_ACTIVE_ENCRYPTION_KEY_ID:-}
      CAREOS_NOTIFICATIONS_ENCRYPTION_KEYS: ${CAREOS_NOTIFICATIONS_ENCRYPTION_KEYS:-}
      CAREOS_NOTIFICATIONS_LEASE_DURATION: ${CAREOS_NOTIFICATIONS_LEASE_DURATION:-30s}
      CAREOS_NOTIFICATIONS_MAXIMUM_ATTEMPTS: ${CAREOS_NOTIFICATIONS_MAXIMUM_ATTEMPTS:-5}
      CAREOS_NOTIFICATIONS_INITIAL_RETRY_DELAY: ${CAREOS_NOTIFICATIONS_INITIAL_RETRY_DELAY:-5s}
      CAREOS_NOTIFICATIONS_MAXIMUM_RETRY_DELAY: ${CAREOS_NOTIFICATIONS_MAXIMUM_RETRY_DELAY:-15m}
      CAREOS_NOTIFICATIONS_TERMINAL_RETENTION: ${CAREOS_NOTIFICATIONS_TERMINAL_RETENTION:-14d}
      CAREOS_NOTIFICATIONS_MAXIMUM_SCHEDULE_AHEAD: ${CAREOS_NOTIFICATIONS_MAXIMUM_SCHEDULE_AHEAD:-365d}
      CAREOS_NOTIFICATIONS_MAXIMUM_CLAIM_BATCH: ${CAREOS_NOTIFICATIONS_MAXIMUM_CLAIM_BATCH:-25}
      CAREOS_NOTIFICATIONS_CLEANUP_BATCH: ${CAREOS_NOTIFICATIONS_CLEANUP_BATCH:-100}
      CAREOS_NOTIFICATIONS_ALLOWED_TEMPLATE_DEFINITIONS: ${CAREOS_NOTIFICATIONS_ALLOWED_TEMPLATE_DEFINITIONS:-}
      CAREOS_JOBS_REDIS_ENABLED: ${CAREOS_JOBS_REDIS_ENABLED:-false}
      CAREOS_JOBS_REDIS_KEY_PREFIX: ${CAREOS_JOBS_REDIS_KEY_PREFIX:-careos:jobs}
      CAREOS_JOBS_REDIS_LEASE_DURATION: ${CAREOS_JOBS_REDIS_LEASE_DURATION:-30s}
      CAREOS_JOBS_REDIS_MAXIMUM_ATTEMPTS: ${CAREOS_JOBS_REDIS_MAXIMUM_ATTEMPTS:-5}
      CAREOS_JOBS_REDIS_INITIAL_RETRY_DELAY: ${CAREOS_JOBS_REDIS_INITIAL_RETRY_DELAY:-5s}
      CAREOS_JOBS_REDIS_MAXIMUM_RETRY_DELAY: ${CAREOS_JOBS_REDIS_MAXIMUM_RETRY_DELAY:-15m}
      CAREOS_JOBS_REDIS_TERMINAL_RETENTION: ${CAREOS_JOBS_REDIS_TERMINAL_RETENTION:-14d}
      CAREOS_JOBS_REDIS_MAXIMUM_SCHEDULE_AHEAD: ${CAREOS_JOBS_REDIS_MAXIMUM_SCHEDULE_AHEAD:-365d}
      CAREOS_JOBS_REDIS_MAXIMUM_CLAIM_BATCH: ${CAREOS_JOBS_REDIS_MAXIMUM_CLAIM_BATCH:-25}
      CAREOS_JOBS_REDIS_CLEANUP_BATCH: ${CAREOS_JOBS_REDIS_CLEANUP_BATCH:-100}
      CAREOS_JOBS_REDIS_ALLOWED_JOB_DEFINITIONS: ${CAREOS_JOBS_REDIS_ALLOWED_JOB_DEFINITIONS:-}
      CAREOS_STORAGE_S3_ENABLED: ${CAREOS_STORAGE_S3_ENABLED:-false}
      CAREOS_STORAGE_S3_ENDPOINT: ${CAREOS_STORAGE_S3_ENDPOINT:-http://minio:9000}
      CAREOS_STORAGE_S3_ACCESS_KEY: ${CAREOS_STORAGE_S3_ACCESS_KEY:-careos-local}
      CAREOS_STORAGE_S3_SECRET_KEY: ${CAREOS_STORAGE_S3_SECRET_KEY:-careos-local-change-me}
      CAREOS_STORAGE_S3_QUARANTINE_BUCKET: ${CAREOS_STORAGE_S3_QUARANTINE_BUCKET:-careos-document-quarantine}
      CAREOS_STORAGE_S3_CLEAN_BUCKET: ${CAREOS_STORAGE_S3_CLEAN_BUCKET:-careos-document-clean}
      CAREOS_STORAGE_S3_MAXIMUM_UPLOAD_BYTES: ${CAREOS_STORAGE_S3_MAXIMUM_UPLOAD_BYTES:-52428800}
      CAREOS_STORAGE_S3_ALLOW_HTTP: ${CAREOS_STORAGE_S3_ALLOW_HTTP:-true}
      CAREOS_STORAGE_S3_CREATE_BUCKET_IF_MISSING: ${CAREOS_STORAGE_S3_CREATE_BUCKET_IF_MISSING:-true}
      CAREOS_DOCUMENT_PROMOTION_ENABLED: ${CAREOS_DOCUMENT_PROMOTION_ENABLED:-false}
      CAREOS_DOCUMENT_PROMOTION_POLICY_KEY: ${CAREOS_DOCUMENT_PROMOTION_POLICY_KEY:-}
      CAREOS_DOCUMENT_PROMOTION_ACCEPTED_SCANNER_KEYS: ${CAREOS_DOCUMENT_PROMOTION_ACCEPTED_SCANNER_KEYS:-}
      CAREOS_DOCUMENT_PROMOTION_MAXIMUM_SCAN_AGE: ${CAREOS_DOCUMENT_PROMOTION_MAXIMUM_SCAN_AGE:-}
      CAREOS_DOCUMENT_PROMOTION_MAXIMUM_FUTURE_SKEW: ${CAREOS_DOCUMENT_PROMOTION_MAXIMUM_FUTURE_SKEW:-0s}
      CAREOS_DOCUMENT_SIGNED_ACCESS_ENABLED: ${CAREOS_DOCUMENT_SIGNED_ACCESS_ENABLED:-false}
      CAREOS_DOCUMENT_SIGNED_ACCESS_POLICY_KEY: ${CAREOS_DOCUMENT_SIGNED_ACCESS_POLICY_KEY:-}
      CAREOS_DOCUMENT_SIGNED_ACCESS_ACCEPTED_PURPOSES: ${CAREOS_DOCUMENT_SIGNED_ACCESS_ACCEPTED_PURPOSES:-}
      CAREOS_DOCUMENT_SIGNED_ACCESS_MAXIMUM_TTL: ${CAREOS_DOCUMENT_SIGNED_ACCESS_MAXIMUM_TTL:-}
      CAREOS_DOCUMENT_SIGNED_ACCESS_MAXIMUM_AUTHORIZATION_AGE: ${CAREOS_DOCUMENT_SIGNED_ACCESS_MAXIMUM_AUTHORIZATION_AGE:-30s}
      CAREOS_DOCUMENT_SIGNED_ACCESS_MAXIMUM_FUTURE_SKEW: ${CAREOS_DOCUMENT_SIGNED_ACCESS_MAXIMUM_FUTURE_SKEW:-2s}
      CAREOS_DOCUMENT_RETENTION_ENABLED: ${CAREOS_DOCUMENT_RETENTION_ENABLED:-false}
      CAREOS_DOCUMENT_RETENTION_POLICY_KEY: ${CAREOS_DOCUMENT_RETENTION_POLICY_KEY:-}
      CAREOS_DOCUMENT_RETENTION_ACCEPTED_PURPOSES: ${CAREOS_DOCUMENT_RETENTION_ACCEPTED_PURPOSES:-}
      CAREOS_DOCUMENT_RETENTION_MINIMUM_RETENTION: ${CAREOS_DOCUMENT_RETENTION_MINIMUM_RETENTION:-}
      CAREOS_DOCUMENT_RETENTION_MAXIMUM_RETENTION: ${CAREOS_DOCUMENT_RETENTION_MAXIMUM_RETENTION:-}
      CAREOS_DOCUMENT_RETENTION_MAXIMUM_AUTHORIZATION_AGE: ${CAREOS_DOCUMENT_RETENTION_MAXIMUM_AUTHORIZATION_AGE:-30s}
      CAREOS_DOCUMENT_RETENTION_MAXIMUM_FUTURE_SKEW: ${CAREOS_DOCUMENT_RETENTION_MAXIMUM_FUTURE_SKEW:-2s}
      CAREOS_SCANNER_CLAMAV_ENABLED: ${CAREOS_SCANNER_CLAMAV_ENABLED:-false}
      CAREOS_SCANNER_CLAMAV_HOST: ${CAREOS_SCANNER_CLAMAV_HOST:-clamav}
      CAREOS_SCANNER_CLAMAV_PORT: ${CAREOS_SCANNER_CLAMAV_PORT:-3310}
      CAREOS_SCANNER_CLAMAV_CONNECT_TIMEOUT: ${CAREOS_SCANNER_CLAMAV_CONNECT_TIMEOUT:-2s}
      CAREOS_SCANNER_CLAMAV_READ_TIMEOUT: ${CAREOS_SCANNER_CLAMAV_READ_TIMEOUT:-30s}
      CAREOS_SCANNER_CLAMAV_MAXIMUM_DEFINITION_AGE: ${CAREOS_SCANNER_CLAMAV_MAXIMUM_DEFINITION_AGE:-36h}
      CAREOS_SCANNER_CLAMAV_DEFINITION_TIME_ZONE: ${CAREOS_SCANNER_CLAMAV_DEFINITION_TIME_ZONE:-UTC}
      CAREOS_SCANNER_CLAMAV_STREAM_CHUNK_BYTES: ${CAREOS_SCANNER_CLAMAV_STREAM_CHUNK_BYTES:-65536}
      CAREOS_SCANNER_CLAMAV_MAXIMUM_SCAN_BYTES: ${CAREOS_SCANNER_CLAMAV_MAXIMUM_SCAN_BYTES:-52428800}
      CAREOS_TRACE_SAMPLING_PROBABILITY: ${CAREOS_TRACE_SAMPLING_PROBABILITY:-0.1}
      CAREOS_OTLP_TRACING_ENABLED: ${CAREOS_OTLP_TRACING_ENABLED:-false}
      CAREOS_OTLP_TRACING_ENDPOINT: ${CAREOS_OTLP_TRACING_ENDPOINT:-http://localhost:4318/v1/traces}
      REDIS_SESSION_NAMESPACE: ${REDIS_SESSION_NAMESPACE:-careos:session}
      SESSION_IDLE_TIMEOUT: ${SESSION_IDLE_TIMEOUT:-30m}
      SESSION_ABSOLUTE_TIMEOUT: ${SESSION_ABSOLUTE_TIMEOUT:-8h}
      RECENT_AUTHENTICATION_WINDOW: ${RECENT_AUTHENTICATION_WINDOW:-10m}
      PASSWORD_RESET_TOKEN_TTL: ${PASSWORD_RESET_TOKEN_TTL:-15m}
      LOGIN_ATTEMPT_LIMIT: ${LOGIN_ATTEMPT_LIMIT:-5}
      LOGIN_ATTEMPT_WINDOW: ${LOGIN_ATTEMPT_WINDOW:-15m}
      MFA_ATTEMPT_LIMIT: ${MFA_ATTEMPT_LIMIT:-5}
      MFA_ATTEMPT_WINDOW: ${MFA_ATTEMPT_WINDOW:-10m}
      MFA_RECOVERY_CODE_COUNT: ${MFA_RECOVERY_CODE_COUNT:-10}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      CAREOS_ALLOWED_ORIGINS: ${CAREOS_ALLOWED_ORIGINS:-http://localhost:4173,http://localhost:5173}
      CAREOS_BASE_URL: ${CAREOS_BASE_URL:-http://localhost:4173}
      CAREOS_SECURITY_MAIL_FROM: ${CAREOS_SECURITY_MAIL_FROM:-no-reply@rootopathy.test}
      CAREOS_TOKEN_PEPPER: ${CAREOS_TOKEN_PEPPER:-CareOS-Local-Token-Pepper-Change-Me}
      CAREOS_MFA_ENCRYPTION_KEY: ${CAREOS_MFA_ENCRYPTION_KEY:-Q2FyZU9TLUxvY2FsLU1GQS1LZXktTXVzdC1DaGFuZ2U=}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      CAREOS_BOOTSTRAP_ADMIN_EMAIL: ${CAREOS_BOOTSTRAP_ADMIN_EMAIL:-owner@rootopathy.test}
      CAREOS_BOOTSTRAP_ADMIN_PASSWORD: ${CAREOS_BOOTSTRAP_ADMIN_PASSWORD:-CareOS-Local-Only-Change-Me}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "/busybox", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 30

  frontend:
    build:
      context: ./frontend
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "4173:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  careos-postgres:
  careos-redis:
  careos-minio:
