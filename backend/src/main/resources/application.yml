spring:
  application:
    name: careos-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_APP_USERNAME}
    password: ${DB_APP_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    url: ${DB_MIGRATION_URL:${DB_URL}}
    user: ${DB_MIGRATION_USERNAME}
    password: ${DB_MIGRATION_PASSWORD}
    placeholders:
      applicationRole: ${DB_APP_ROLE:${DB_APP_USERNAME}}
      foundationSyntheticDataEnabled: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}
  session:
    data:
      redis:
        namespace: ${REDIS_SESSION_NAMESPACE:careos:session}
        repository-type: indexed
    timeout: ${SESSION_IDLE_TIMEOUT:30m}
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:1025}
  threads:
    virtual:
      enabled: true
server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        name: CAREOS_SESSION
        same-site: strict
        secure: ${SESSION_COOKIE_SECURE:true}
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-components: never
      show-details: never
      probes:
        enabled: true
        add-additional-paths: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    baggage:
      enabled: false
    propagation:
      consume: w3c
      produce: w3c
    sampling:
      probability: ${CAREOS_TRACE_SAMPLING_PROBABILITY:0.1}
    export:
      otlp:
        enabled: ${CAREOS_OTLP_TRACING_ENABLED:false}
  opentelemetry:
    map-environment-variables: false
    tracing:
      limits:
        max-attributes: 64
        max-attribute-value-length: 256
        max-events: 32
        max-links: 16
      export:
        otlp:
          endpoint: ${CAREOS_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
logging:
  structured:
    format:
      console: ecs
careos:
  authorization:
    reference-policy-enabled: ${CAREOS_AUTHORIZATION_REFERENCE_POLICY_ENABLED:false}
    active-registry-version: ${CAREOS_AUTHORIZATION_ACTIVE_REGISTRY_VERSION:m1-candidate-1}
    approval-package-sha256: ${CAREOS_AUTHORIZATION_APPROVAL_PACKAGE_SHA256:19aff5ce30516b7ee2101c093a8429d8a74394995ca90d486790bcc18a392946}
  invitations:
    enabled: ${CAREOS_INVITATIONS_ENABLED:false}
    token-ttl: ${CAREOS_INVITATION_TOKEN_TTL:24h}
    idempotency-ttl: ${CAREOS_INVITATION_IDEMPOTENCY_TTL:24h}
    acceptance-attempt-limit: ${CAREOS_INVITATION_ACCEPTANCE_ATTEMPT_LIMIT:10}
    acceptance-attempt-window: ${CAREOS_INVITATION_ACCEPTANCE_ATTEMPT_WINDOW:15m}
  service-identities:
    enabled: ${CAREOS_SERVICE_IDENTITIES_ENABLED:false}
    credential-pepper: ${CAREOS_SERVICE_IDENTITY_CREDENTIAL_PEPPER:}
  mfa-administration:
    enabled: ${CAREOS_MFA_ADMINISTRATION_ENABLED:false}
    approval-ttl: ${CAREOS_MFA_ADMINISTRATION_APPROVAL_TTL:30m}
    idempotency-ttl: ${CAREOS_MFA_ADMINISTRATION_IDEMPOTENCY_TTL:24h}
  membership-administration:
    enabled: ${CAREOS_MEMBERSHIP_ADMINISTRATION_ENABLED:false}
    approval-ttl: ${CAREOS_MEMBERSHIP_ADMINISTRATION_APPROVAL_TTL:30m}
    idempotency-ttl: ${CAREOS_MEMBERSHIP_ADMINISTRATION_IDEMPOTENCY_TTL:24h}
  notifications:
    postgres:
      enabled: ${CAREOS_NOTIFICATIONS_POSTGRES_ENABLED:false}
      active-encryption-key-id: ${CAREOS_NOTIFICATIONS_ACTIVE_ENCRYPTION_KEY_ID:}
      encryption-keys: ${CAREOS_NOTIFICATIONS_ENCRYPTION_KEYS:}
      lease-duration: ${CAREOS_NOTIFICATIONS_LEASE_DURATION:30s}
      maximum-attempts: ${CAREOS_NOTIFICATIONS_MAXIMUM_ATTEMPTS:5}
      initial-retry-delay: ${CAREOS_NOTIFICATIONS_INITIAL_RETRY_DELAY:5s}
      maximum-retry-delay: ${CAREOS_NOTIFICATIONS_MAXIMUM_RETRY_DELAY:15m}
      terminal-retention: ${CAREOS_NOTIFICATIONS_TERMINAL_RETENTION:14d}
      maximum-schedule-ahead: ${CAREOS_NOTIFICATIONS_MAXIMUM_SCHEDULE_AHEAD:365d}
      maximum-claim-batch: ${CAREOS_NOTIFICATIONS_MAXIMUM_CLAIM_BATCH:25}
      cleanup-batch: ${CAREOS_NOTIFICATIONS_CLEANUP_BATCH:100}
      allowed-template-definitions: ${CAREOS_NOTIFICATIONS_ALLOWED_TEMPLATE_DEFINITIONS:}
  jobs:
    redis:
      enabled: ${CAREOS_JOBS_REDIS_ENABLED:false}
      key-prefix: ${CAREOS_JOBS_REDIS_KEY_PREFIX:careos:jobs}
      lease-duration: ${CAREOS_JOBS_REDIS_LEASE_DURATION:30s}
      maximum-attempts: ${CAREOS_JOBS_REDIS_MAXIMUM_ATTEMPTS:5}
      initial-retry-delay: ${CAREOS_JOBS_REDIS_INITIAL_RETRY_DELAY:5s}
      maximum-retry-delay: ${CAREOS_JOBS_REDIS_MAXIMUM_RETRY_DELAY:15m}
      terminal-retention: ${CAREOS_JOBS_REDIS_TERMINAL_RETENTION:14d}
      maximum-schedule-ahead: ${CAREOS_JOBS_REDIS_MAXIMUM_SCHEDULE_AHEAD:365d}
      maximum-claim-batch: ${CAREOS_JOBS_REDIS_MAXIMUM_CLAIM_BATCH:25}
      cleanup-batch: ${CAREOS_JOBS_REDIS_CLEANUP_BATCH:100}
      allowed-job-definitions: ${CAREOS_JOBS_REDIS_ALLOWED_JOB_DEFINITIONS:}
  scanner:
    clamav:
      enabled: ${CAREOS_SCANNER_CLAMAV_ENABLED:false}
      host: ${CAREOS_SCANNER_CLAMAV_HOST:localhost}
      port: ${CAREOS_SCANNER_CLAMAV_PORT:3310}
      connect-timeout: ${CAREOS_SCANNER_CLAMAV_CONNECT_TIMEOUT:2s}
      read-timeout: ${CAREOS_SCANNER_CLAMAV_READ_TIMEOUT:30s}
      maximum-definition-age: ${CAREOS_SCANNER_CLAMAV_MAXIMUM_DEFINITION_AGE:36h}
      definition-time-zone: ${CAREOS_SCANNER_CLAMAV_DEFINITION_TIME_ZONE:UTC}
      stream-chunk-bytes: ${CAREOS_SCANNER_CLAMAV_STREAM_CHUNK_BYTES:65536}
      maximum-scan-bytes: ${CAREOS_SCANNER_CLAMAV_MAXIMUM_SCAN_BYTES:52428800}
  storage:
    s3:
      enabled: ${CAREOS_STORAGE_S3_ENABLED:false}
      endpoint: ${CAREOS_STORAGE_S3_ENDPOINT:http://localhost:9000}
      access-key: ${CAREOS_STORAGE_S3_ACCESS_KEY:}
      secret-key: ${CAREOS_STORAGE_S3_SECRET_KEY:}
      quarantine-bucket: ${CAREOS_STORAGE_S3_QUARANTINE_BUCKET:careos-document-quarantine}
      clean-bucket: ${CAREOS_STORAGE_S3_CLEAN_BUCKET:careos-document-clean}
      maximum-upload-bytes: ${CAREOS_STORAGE_S3_MAXIMUM_UPLOAD_BYTES:52428800}
      allow-http: ${CAREOS_STORAGE_S3_ALLOW_HTTP:false}
      create-bucket-if-missing: ${CAREOS_STORAGE_S3_CREATE_BUCKET_IF_MISSING:false}
  evidence-export:
    storage:
      enabled: ${CAREOS_EVIDENCE_EXPORT_STORAGE_ENABLED:false}
      endpoint: ${CAREOS_EVIDENCE_EXPORT_STORAGE_ENDPOINT:http://localhost:9000}
      public-endpoint: ${CAREOS_EVIDENCE_EXPORT_STORAGE_PUBLIC_ENDPOINT:${CAREOS_EVIDENCE_EXPORT_STORAGE_ENDPOINT:http://localhost:9000}}
      access-key: ${CAREOS_EVIDENCE_EXPORT_STORAGE_ACCESS_KEY:}
      secret-key: ${CAREOS_EVIDENCE_EXPORT_STORAGE_SECRET_KEY:}
      bucket: ${CAREOS_EVIDENCE_EXPORT_STORAGE_BUCKET:careos-evidence-exports}
      allow-http: ${CAREOS_EVIDENCE_EXPORT_STORAGE_ALLOW_HTTP:false}
      create-bucket-if-missing: ${CAREOS_EVIDENCE_EXPORT_STORAGE_CREATE_BUCKET_IF_MISSING:false}
  documents:
    promotion:
      enabled: ${CAREOS_DOCUMENT_PROMOTION_ENABLED:false}
      policy-key: ${CAREOS_DOCUMENT_PROMOTION_POLICY_KEY:}
      accepted-scanner-keys: ${CAREOS_DOCUMENT_PROMOTION_ACCEPTED_SCANNER_KEYS:}
      maximum-scan-age: ${CAREOS_DOCUMENT_PROMOTION_MAXIMUM_SCAN_AGE:}
      maximum-future-skew: ${CAREOS_DOCUMENT_PROMOTION_MAXIMUM_FUTURE_SKEW:0s}
    signed-access:
      enabled: ${CAREOS_DOCUMENT_SIGNED_ACCESS_ENABLED:false}
      policy-key: ${CAREOS_DOCUMENT_SIGNED_ACCESS_POLICY_KEY:}
      accepted-purposes: ${CAREOS_DOCUMENT_SIGNED_ACCESS_ACCEPTED_PURPOSES:}
      maximum-ttl: ${CAREOS_DOCUMENT_SIGNED_ACCESS_MAXIMUM_TTL:}
      maximum-authorization-age: ${CAREOS_DOCUMENT_SIGNED_ACCESS_MAXIMUM_AUTHORIZATION_AGE:30s}
      maximum-future-skew: ${CAREOS_DOCUMENT_SIGNED_ACCESS_MAXIMUM_FUTURE_SKEW:2s}
    retention:
      enabled: ${CAREOS_DOCUMENT_RETENTION_ENABLED:false}
      policy-key: ${CAREOS_DOCUMENT_RETENTION_POLICY_KEY:}
      accepted-purposes: ${CAREOS_DOCUMENT_RETENTION_ACCEPTED_PURPOSES:}
      minimum-retention: ${CAREOS_DOCUMENT_RETENTION_MINIMUM_RETENTION:}
      maximum-retention: ${CAREOS_DOCUMENT_RETENTION_MAXIMUM_RETENTION:}
      maximum-authorization-age: ${CAREOS_DOCUMENT_RETENTION_MAXIMUM_AUTHORIZATION_AGE:30s}
      maximum-future-skew: ${CAREOS_DOCUMENT_RETENTION_MAXIMUM_FUTURE_SKEW:2s}
  security:
    allowed-origins: ${CAREOS_ALLOWED_ORIGINS}
    application-base-url: ${CAREOS_BASE_URL}
    mail-from: ${CAREOS_SECURITY_MAIL_FROM}
    token-pepper: ${CAREOS_TOKEN_PEPPER}
    mfa-encryption-key: ${CAREOS_MFA_ENCRYPTION_KEY}
    session-absolute-timeout: ${SESSION_ABSOLUTE_TIMEOUT:8h}
    recent-authentication-window: ${RECENT_AUTHENTICATION_WINDOW:10m}
    password-reset-token-ttl: ${PASSWORD_RESET_TOKEN_TTL:15m}
    login-attempt-limit: ${LOGIN_ATTEMPT_LIMIT:5}
    login-attempt-window: ${LOGIN_ATTEMPT_WINDOW:15m}
    mfa-attempt-limit: ${MFA_ATTEMPT_LIMIT:5}
    mfa-attempt-window: ${MFA_ATTEMPT_WINDOW:10m}
    recovery-code-count: ${MFA_RECOVERY_CODE_COUNT:10}
