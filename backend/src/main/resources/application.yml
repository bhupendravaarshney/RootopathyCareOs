spring:
  application:
    name: careos-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/careos_dev}
    username: ${DB_APP_USERNAME:careos_app}
    password: ${DB_APP_PASSWORD:careos-app-local-only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    url: ${DB_MIGRATION_URL:${DB_URL:jdbc:postgresql://localhost:5432/careos_dev}}
    user: ${DB_MIGRATION_USERNAME:careos_migrator}
    password: ${DB_MIGRATION_PASSWORD:careos-migrator-local-only}
    placeholders:
      applicationRole: ${DB_APP_ROLE:${DB_APP_USERNAME:careos_app}}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}
  session:
    data:
      redis:
        namespace: ${REDIS_SESSION_NAMESPACE:careos:session}
        repository-type: indexed
    timeout: ${SESSION_IDLE_TIMEOUT:30m}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
  threads:
    virtual:
      enabled: true
server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        name: CAREOS_SESSION
        same-site: strict
        secure: ${SESSION_COOKIE_SECURE:true}
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
careos:
  notifications:
    postgres:
      enabled: ${CAREOS_NOTIFICATIONS_POSTGRES_ENABLED:false}
      active-encryption-key-id: ${CAREOS_NOTIFICATIONS_ACTIVE_ENCRYPTION_KEY_ID:}
      encryption-keys: ${CAREOS_NOTIFICATIONS_ENCRYPTION_KEYS:}
      lease-duration: ${CAREOS_NOTIFICATIONS_LEASE_DURATION:30s}
      maximum-attempts: ${CAREOS_NOTIFICATIONS_MAXIMUM_ATTEMPTS:5}
      initial-retry-delay: ${CAREOS_NOTIFICATIONS_INITIAL_RETRY_DELAY:5s}
      maximum-retry-delay: ${CAREOS_NOTIFICATIONS_MAXIMUM_RETRY_DELAY:15m}
      terminal-retention: ${CAREOS_NOTIFICATIONS_TERMINAL_RETENTION:14d}
      maximum-schedule-ahead: ${CAREOS_NOTIFICATIONS_MAXIMUM_SCHEDULE_AHEAD:365d}
      maximum-claim-batch: ${CAREOS_NOTIFICATIONS_MAXIMUM_CLAIM_BATCH:25}
      cleanup-batch: ${CAREOS_NOTIFICATIONS_CLEANUP_BATCH:100}
      allowed-template-definitions: ${CAREOS_NOTIFICATIONS_ALLOWED_TEMPLATE_DEFINITIONS:}
  jobs:
    redis:
      enabled: ${CAREOS_JOBS_REDIS_ENABLED:false}
      key-prefix: ${CAREOS_JOBS_REDIS_KEY_PREFIX:careos:jobs}
      lease-duration: ${CAREOS_JOBS_REDIS_LEASE_DURATION:30s}
      maximum-attempts: ${CAREOS_JOBS_REDIS_MAXIMUM_ATTEMPTS:5}
      initial-retry-delay: ${CAREOS_JOBS_REDIS_INITIAL_RETRY_DELAY:5s}
      maximum-retry-delay: ${CAREOS_JOBS_REDIS_MAXIMUM_RETRY_DELAY:15m}
      terminal-retention: ${CAREOS_JOBS_REDIS_TERMINAL_RETENTION:14d}
      maximum-schedule-ahead: ${CAREOS_JOBS_REDIS_MAXIMUM_SCHEDULE_AHEAD:365d}
      maximum-claim-batch: ${CAREOS_JOBS_REDIS_MAXIMUM_CLAIM_BATCH:25}
      cleanup-batch: ${CAREOS_JOBS_REDIS_CLEANUP_BATCH:100}
      allowed-job-definitions: ${CAREOS_JOBS_REDIS_ALLOWED_JOB_DEFINITIONS:}
  scanner:
    clamav:
      enabled: ${CAREOS_SCANNER_CLAMAV_ENABLED:false}
      host: ${CAREOS_SCANNER_CLAMAV_HOST:localhost}
      port: ${CAREOS_SCANNER_CLAMAV_PORT:3310}
      connect-timeout: ${CAREOS_SCANNER_CLAMAV_CONNECT_TIMEOUT:2s}
      read-timeout: ${CAREOS_SCANNER_CLAMAV_READ_TIMEOUT:30s}
      maximum-definition-age: ${CAREOS_SCANNER_CLAMAV_MAXIMUM_DEFINITION_AGE:36h}
      definition-time-zone: ${CAREOS_SCANNER_CLAMAV_DEFINITION_TIME_ZONE:UTC}
      stream-chunk-bytes: ${CAREOS_SCANNER_CLAMAV_STREAM_CHUNK_BYTES:65536}
      maximum-scan-bytes: ${CAREOS_SCANNER_CLAMAV_MAXIMUM_SCAN_BYTES:52428800}
  storage:
    s3:
      enabled: ${CAREOS_STORAGE_S3_ENABLED:false}
      endpoint: ${CAREOS_STORAGE_S3_ENDPOINT:http://localhost:9000}
      access-key: ${CAREOS_STORAGE_S3_ACCESS_KEY:}
      secret-key: ${CAREOS_STORAGE_S3_SECRET_KEY:}
      quarantine-bucket: ${CAREOS_STORAGE_S3_QUARANTINE_BUCKET:careos-document-quarantine}
      maximum-upload-bytes: ${CAREOS_STORAGE_S3_MAXIMUM_UPLOAD_BYTES:52428800}
      allow-http: ${CAREOS_STORAGE_S3_ALLOW_HTTP:false}
      create-bucket-if-missing: ${CAREOS_STORAGE_S3_CREATE_BUCKET_IF_MISSING:false}
  security:
    allowed-origins: ${CAREOS_ALLOWED_ORIGINS:http://localhost:4173,http://localhost:5173}
    application-base-url: ${CAREOS_BASE_URL:http://localhost:4173}
    mail-from: ${CAREOS_SECURITY_MAIL_FROM:no-reply@rootopathy.test}
    token-pepper: ${CAREOS_TOKEN_PEPPER}
    mfa-encryption-key: ${CAREOS_MFA_ENCRYPTION_KEY}
    session-absolute-timeout: ${SESSION_ABSOLUTE_TIMEOUT:8h}
    recent-authentication-window: ${RECENT_AUTHENTICATION_WINDOW:10m}
    password-reset-token-ttl: ${PASSWORD_RESET_TOKEN_TTL:15m}
    login-attempt-limit: ${LOGIN_ATTEMPT_LIMIT:5}
    login-attempt-window: ${LOGIN_ATTEMPT_WINDOW:15m}
    mfa-attempt-limit: ${MFA_ATTEMPT_LIMIT:5}
    mfa-attempt-window: ${MFA_ATTEMPT_WINDOW:10m}
    recovery-code-count: ${MFA_RECOVERY_CODE_COUNT:10}
  bootstrap-admin:
    email: ${CAREOS_BOOTSTRAP_ADMIN_EMAIL:owner@rootopathy.test}
    password: ${CAREOS_BOOTSTRAP_ADMIN_PASSWORD:CareOS-Local-Only-Change-Me}
